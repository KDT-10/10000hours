<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>1만 시간의 법칙</title>
  </head>
  <body>
    <div class="main-title">
      <img src="images/clock.png" alt="시계" class="clock" />
      <img src="images/title.png" alt="제목" class="title" />
    </div>
    <div class="quote">"연습은 어제의 당신보다 당신을 더 낫게 만든다."</div>
    <div class="quote-wrapper">
      <img src="images/quotes.png" alt="큰따옴표" class="quote-bg" />
      <p>
        <span style="font-size: 24px; font-family: GMarketSansBold"
          >1만 시간의 법칙</span
        >
        은<br />어떤 분야의 전문가가 되기 위해서는<br />
        최소한 1만 시간의 훈련이 필요하다는 법칙이다.
      </p>
    </div>
    <button type="button" class="btn btn-training_hour">
      나는 며칠 동안 훈련을 해야 1만 시간이 될까?
    </button>
    <div class="container-click">
      <img src="images/click.png" alt="클릭" />
    </div>
    <p>당신은 <span>프로그래밍</span> 전문가가 되기 위해서</p>
    <p>대략 <span>5110</span> 일 이상 훈련하셔야 합니다! :)</p>
    <button type="button" class="btn btn-training">훈련하러 가기 GO!GO!</button>
    <button type="button" class="btn btn-sharing">공유하기</button>
  </body>
</html>
