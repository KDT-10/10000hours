<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title></title>
  </head>
  <body>
    <div class="image-stack-container">
      <img src="images/clock.png" alt="시계" class="background-image" />
      <img src="images/title.png" alt="1만 시간의 법칙" class="overlay-image" />
    </div>

    <div class="font-box">
      <h1 class="font">"연습은 어제의 당신보다 당신을 더 낫게 만든다."</h1>
    </div>

    <div class="text">
      <div class="Text">
        <span>
          <span class="title-highlight">1만 시간의 법칙</span>
          은
        </span>
        어떤 분야의 전문가가 되기 위해서는<br />
        최소한 1만 시간의 훈련이 필요하다는 법칙이다.
      </div>
      <img src="images/quotes.png" alt="text" class="img" />
    </div>
    <div class="text2">
      <p>나는</p>
      <div class="programing">예)프로그래밍</div>
      전문가가 될 것이다.
    </div>

    <div class="text3">
      <p>그래서 앞으로 매일 하루에</p>
      <div class="programing">예)5시간</div>
      시간씩 훈련할 것이다.
    </div>

    <div class="border">
      <span class="yellow"> 나는 며칠 동안 훈련을 해야 1만 시간이 될까? </span>
      <img src="images/click.png" alt="click" class="pinger" />
    </div>

    <div class="result-box">
      <p class="result-line-1">
        당신은 <span class="highlight-large">프로그래밍</span> 전문가가 되기
        위해서
      </p>
    </div>
    <div class="result-box-1">
      <p class="result-line-2">
        대략 <span class="number-large">5110</span> 일 이상 훈련하셔야 합니다!
        :)
      </p>
    </div>

    <div class="grid">
      <div class="gogo">훈련하러 가기 GO!GO!</div>
      <div class="share">공유하기</div>
    </div>
  </body>
</html>
