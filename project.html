<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나만의 시간</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--타이틀-->
    <div class="container">
      <div class="main-title">
        <img src="images/clock.png" alt="clock" />
        <img class="title-icon" src="images/title.png" alt="title" />
      </div>
      <!--텍스트 1만시간-->
      <p class="text">"연습은 어제의 당신보다 당신을 더 낫게 만든다"</p>
      <div class="definition-box">
        <img src="images/quotes.png" alt="quotes" class="quote-icon" />
        <p class="definition-text">
          1만 시간의 법칙은 어떤 분야의<br />
          전문가가 되기 위해서는 <br />
          최소한 1만 시간의 훈련이 필요하다는 법칙이다.
        </p>
      </div>
      <!--인풋필드-->
      <div class="input">
        나는
        <input
          type="text"
          id="program"
          name="program"
          placeholder="예)프로그래밍에"
          class="input-field"
        />
        전문가가 될것이다.<br />
        그래서 앞으로 매일 하루에<input
          type="text"
          id="hour"
          name="hour"
          placeholder="예)5시간"
          class="input-field"
        />씩 훈련 할것이다.
      </div>
      <!--버튼-->
      <button class="action-buttons">
        나는 며칠 동안 훈련을 해야 1만시간이 될가?
      </button>

      <img src="images/click.png" alt="icon" class="icon" />
      <p class="Result">
        당신의 프로그래밍 전문가가 되위해서는<br />
        대략 5110시간이 필요합니다.
      </p>
      <span class="sitebotton">
        <button class="button">훈련하러 가기 Go!Go!</button>
        <button class="button">공유하기</button>
      </span>
    </div>
  </body>
</html>
